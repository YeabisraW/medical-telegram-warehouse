name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Change '3.9' to '3.10'

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest dbt-postgres
      - name: Run Unit Tests
        run: pytest
      - name: dbt Compile Check
        run: dbt compile --profiles-dir .