name: Data Pipeline CI

on:
  push:
    branches: [ main, master, develop, task ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: telegram_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest dbt-postgres

      - name: dbt Compile Check
        env:
          DBT_HOST: localhost
          DBT_USER: user
          DBT_PASS: password
          DBT_PORT: 5432
          DBT_DBNAME: telegram_db
          DBT_SCHEMA: raw
        run: |
          if [ -d "medical_warehouse" ]; then
            cd medical_warehouse
            dbt compile --target github_ci || echo "dbt not initialized yet"
          else
            echo "dbt directory not found, skipping compile check"
          fi